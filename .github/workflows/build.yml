name: Build APK from ZIP

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    env:
      ESRI_API_KEY: ${{ secrets.ESRI_API_KEY }}
      ORG_GRADLE_PROJECT_ESRI_API_KEY: ${{ secrets.ESRI_API_KEY }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.0"

      - name: Verificar ESRI_API_KEY
        shell: bash
        run: |
          if [ -z "${ESRI_API_KEY:-}" ]; then
            echo "::error::El secreto ESRI_API_KEY no esta configurado."
            exit 1
          fi

          echo "ESRI_API_KEY detectada correctamente."

      - name: Buscar y extraer Geo Topo
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'GeoTopo*.zip' -printf '%f\n' | sort -V | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No se encontro ningun ZIP en la raiz del repositorio."
            exit 1
          fi

          echo "ZIP seleccionado: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="extracted"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            NESTED="$(find extracted -mindepth 1 -maxdepth 3 -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n 1)"

            if [ -n "$NESTED" ]; then
              PROJECT_DIR="$NESTED"
            fi
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::No se encontro el proyecto Gradle dentro del ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::No se genero el APK."
            exit 1
          fi

          echo "APK generado correctamente."

      - name: Subir APK
        uses: actions/upload-artifact@v5
        with:
          name: GeoTopo-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
